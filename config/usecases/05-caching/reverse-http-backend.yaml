state_dir: "${QPX_STATE_DIR:-~/.local/share/qpx}"
caches:
- name: object-store-gateway
  kind: http
  writer_mode: single_instance
  endpoint: http://127.0.0.1:19080
  # A gateway used for cache writes must implement the writer-lease contract
  # (PUT/GET/DELETE /v1/cache/<namespace>/_writer_lock with conditional
  # create, renewal and release). See docs/config-schema.md. Without it cache
  # writes fail closed; do not enable allow_local_only_remote_coordination
  # unless exactly one process ever writes this namespace.
  timeout_ms: 1500
  max_object_bytes: 2097152
edges:
- kind: reverse
  name: site
  listen: 127.0.0.1:8443
  routes:
  - match:
      host:
      - cache.example.local
      path:
      - "/assets/*"
      - "/docs/*"
      method:
      - GET
      - HEAD
    cache:
      enabled: true
      backend: object-store-gateway
      namespace: reverse-site-assets
      default_ttl_secs: 300
      max_object_bytes: 2097152
    target:
      type: upstream
      upstreams:
      - http://127.0.0.1:18080
  - match:
      host:
      - cache.example.local
    target:
      type: upstream
      upstreams:
      - http://127.0.0.1:18081
