name: release
permissions:
  contents: write
  id-token: write
  attestations: write
  checks: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            use_cross: false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release provenance on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release tag $GITHUB_REF is not on main; main receives releases only" >&2
            exit 1
          fi

      - name: Require RFC release gate success for this commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          for attempt in $(seq 1 90); do
            CONCLUSION="$(gh api --method GET "repos/${{ github.repository }}/commits/$SHA/check-runs" -f check_name='HTTP RFC compliance release gate' -f per_page=100 --jq '.check_runs | map(select(.name == "HTTP RFC compliance release gate")) | .[0] | "\(.status)/\(.conclusion // "pending")"' 2>/dev/null || echo "fetch-failed/pending")"
            case "$CONCLUSION" in
              completed/success) echo "RFC gate success for $SHA"; exit 0 ;;
              completed/*) echo "RFC gate not successful: $CONCLUSION" >&2; exit 1 ;;
            esac
            echo "waiting for RFC gate ($CONCLUSION, attempt $attempt/90)..." >&2
            sleep 60
          done
          echo "RFC gate evidence missing/timed out for $SHA" >&2
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        env:
          QPXD_SAMPLE_RUSTLS_FEATURES: qpxd/auth-digest,qpxd/auth-ldap
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --workspace --release --locked --target ${{ matrix.target }} --features "${QPXD_SAMPLE_RUSTLS_FEATURES}"
          else
            cargo build --workspace --release --locked --target ${{ matrix.target }} --features "${QPXD_SAMPLE_RUSTLS_FEATURES}"
          fi
        shell: bash

      - name: Package
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *-pc-windows-*) EXT=".exe" ;;
            *) EXT="" ;;
          esac

          BINARY_NAME="qpxd"
          RELEASE_NAME="qpx-${{ matrix.target }}"
          mkdir -p "$RELEASE_NAME"

          # Generate licenses for the full workspace using our pinned config/lockfile.
          cargo about generate --fail --config about.toml --workspace --locked licenses/about.hbs > THIRDPARTY.md

          # Copy binaries
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}${EXT}" "$RELEASE_NAME/"
          if [ -f "target/${{ matrix.target }}/release/qpxr${EXT}" ]; then
            cp "target/${{ matrix.target }}/release/qpxr${EXT}" "$RELEASE_NAME/"
          fi
          if [ -f "target/${{ matrix.target }}/release/qpxc${EXT}" ]; then
            cp "target/${{ matrix.target }}/release/qpxc${EXT}" "$RELEASE_NAME/"
          fi
          if [ -f "target/${{ matrix.target }}/release/qpxf${EXT}" ]; then
            cp "target/${{ matrix.target }}/release/qpxf${EXT}" "$RELEASE_NAME/"
          fi

          # Copy other files
          cp README.md LICENSE THIRDPARTY.md "$RELEASE_NAME/"
          cp -r config "$RELEASE_NAME/"

          # Create archive
          case "${{ matrix.target }}" in
            *-pc-windows-*)
              7z a "${RELEASE_NAME}.zip" "${RELEASE_NAME}"
              ASSET="${RELEASE_NAME}.zip"
              ;;
            *)
              tar czvf "${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}"
              ASSET="${RELEASE_NAME}.tar.gz"
              ;;
          esac

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "ASSET_SHA256=${ASSET}.sha256" >> "$GITHUB_ENV"

      - name: Attest archive provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: ${{ env.ASSET }}

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA256 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
