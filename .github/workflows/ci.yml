name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.96
      - name: check workspace on MSRV
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --locked

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1.43.5

  sensitive_artifacts:
    name: sensitive artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: reject local paths, secrets, and runtime artifacts
        run: bash ./scripts/check-sensitive-artifacts.sh

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  public_api:
    name: public-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: public-api
      - name: install cargo-public-api
        run: cargo install cargo-public-api --locked
      - name: check public API fingerprints
        run: bash ./scripts/check-public-api.sh

  machete:
    name: unused-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: bnjbvr/cargo-machete@v0.6.0

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: llvm-cov
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: collect coverage
        run: cargo llvm-cov --workspace --locked --fail-under-lines 20

  e2e_tests:
    name: e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd lsof curl openssl procps
      - name: build qpxd (no warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build -p qpxd --locked
      - name: run control-plane e2e
        run: bash ./scripts/e2e-control-plane.sh
      - name: run control-plane soak e2e
        run: bash ./scripts/e2e-control-plane-soak.sh
      - name: run sample-config e2e
        run: bash ./scripts/e2e-config-samples.sh
      - name: run local-response e2e
        run: bash ./scripts/e2e-local-response.sh
      - name: run http2 e2e
        run: bash ./scripts/e2e-http2.sh
      - name: run ACME Pebble e2e
        run: bash ./scripts/e2e-acme-pebble.sh

  e2e_control_plane_windows:
    name: control-plane e2e (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build qpxd (no warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build -p qpxd --locked
      - name: run control-plane e2e (windows)
        shell: pwsh
        run: ./scripts/e2e-control-plane.ps1

  perf_smoke:
    name: perf smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: perf smoke (release)
        id: perf_smoke_release
        continue-on-error: true
        env:
          RUSTFLAGS: "-D warnings"
          QPX_PERF_SMOKE_JSON: ${{ github.workspace }}/target/perf/perf-smoke.jsonl
        run: |
          mkdir -p target/perf
          cargo test -p qpxd --release --test perf_smoke --locked -- --nocapture
      - name: advanced transport perf (release)
        id: advanced_transport_perf_release
        continue-on-error: true
        env:
          RUSTFLAGS: "-D warnings"
          QPX_PERF_SMOKE_JSON: ${{ github.workspace }}/target/perf/advanced-transport-perf.jsonl
        run: |
          mkdir -p target/perf
          cargo test -p qpxd --release --test advanced_transport_perf --locked --features http3-backend-qpx,mitm -- --nocapture
      - name: fail if any perf smoke evaluation failed
        if: always()
        env:
          PERF_SMOKE_RELEASE: ${{ steps.perf_smoke_release.outcome }}
          ADVANCED_TRANSPORT_PERF_RELEASE: ${{ steps.advanced_transport_perf_release.outcome }}
        run: |
          failed=0
          if [ "$PERF_SMOKE_RELEASE" != "success" ]; then
            echo "perf smoke (release) failed: $PERF_SMOKE_RELEASE" >&2
            failed=1
          fi
          if [ "$ADVANCED_TRANSPORT_PERF_RELEASE" != "success" ]; then
            echo "advanced transport perf (release) failed: $ADVANCED_TRANSPORT_PERF_RELEASE" >&2
            failed=1
          fi
          exit "$failed"
      - name: upload perf smoke artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qpx-perf-smoke-jsonl
          path: target/perf/*.jsonl
          if-no-files-found: ignore

  perf_audit:
    name: perf audit
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: verify perf runner capacity
        env:
          QPX_PERF_RUNNER_JSON: ${{ github.workspace }}/target/perf/runner.jsonl
        run: |
          mkdir -p target/perf
          scripts/check-perf-runner.sh
      - name: install proxy comparison packages
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-utils iproute2 lighttpd nginx nghttp2-client openssl squid valgrind wrk
      - name: criterion streaming throughput bench
        id: criterion_streaming_throughput_bench
        continue-on-error: true
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          mkdir -p target/perf
          printf '{"bench":"criterion_streaming_throughput","first_byte_ms":null,"p95_chunk_gap_ms":null,"total_ms":null,"rss_peak_mb":null,"cpu_ms":null,"bytes":null,"commit":"%s"}\n' "${GITHUB_SHA:-unknown}" > target/perf/perf-audit-criterion.jsonl
          cargo bench -p qpxd --bench streaming_throughput --locked -- --sample-size 10
      - name: h3 crate protocol perf benchmarks
        id: h3_crate_protocol_perf_benchmarks
        continue-on-error: true
        env:
          RUSTFLAGS: "-D warnings"
          QPX_PERF_SMOKE_JSON: ${{ github.workspace }}/target/perf/perf-audit-protocol-h3-crate-perf.jsonl
        run: |
          cargo test -p qpxd --release --test perf_smoke --locked --features http3-backend-h3 -- --nocapture
      - name: qpx http3 protocol perf benchmarks
        id: qpx_http3_protocol_perf_benchmarks
        continue-on-error: true
        env:
          RUSTFLAGS: "-D warnings"
          QPX_PERF_SMOKE_JSON: ${{ github.workspace }}/target/perf/perf-audit-protocol-qpx-h3-perf.jsonl
        run: |
          cargo test -p qpxd --release --test perf_smoke --locked --features http3-backend-qpx -- --nocapture
      - name: advanced transport perf benchmarks
        id: advanced_transport_perf_benchmarks
        continue-on-error: true
        env:
          RUSTFLAGS: "-D warnings"
          QPX_PERF_SMOKE_JSON: ${{ github.workspace }}/target/perf/perf-audit-advanced-transport-perf.jsonl
        run: |
          cargo test -p qpxd --release --test advanced_transport_perf --locked --features http3-backend-qpx,mitm -- --nocapture
      - name: external proxy comparison bench
        id: external_proxy_comparison_bench
        continue-on-error: true
        env:
          RUSTFLAGS: "-D warnings"
          QPX_PROXY_COMPARE_JSON: ${{ github.workspace }}/target/perf/perf-audit-proxy-compare.jsonl
        run: |
          cargo build -p qpxd --release --locked
          scripts/perf-audit-proxy-compare.sh "$QPX_PROXY_COMPARE_JSON"
      - name: external http2 comparison bench
        id: external_http2_comparison_bench
        continue-on-error: true
        env:
          QPX_HTTP2_COMPARE_JSON: ${{ github.workspace }}/target/perf/perf-audit-http2-compare.jsonl
        run: scripts/perf-audit-http2-compare.sh "$QPX_HTTP2_COMPARE_JSON"
      - name: external long streaming comparison bench
        id: external_long_streaming_comparison_bench
        continue-on-error: true
        env:
          QPX_STREAMING_COMPARE_JSON: ${{ github.workspace }}/target/perf/perf-audit-streaming-compare.jsonl
        run: scripts/perf-audit-streaming-compare.sh "$QPX_STREAMING_COMPARE_JSON"
      - name: allocation profile
        id: allocation_profile
        continue-on-error: true
        env:
          QPX_ALLOCATION_PROFILE_JSON: ${{ github.workspace }}/target/perf/perf-audit-allocation-profile.jsonl
          QPX_ALLOCATION_PROFILE_DIR: ${{ github.workspace }}/target/perf/allocations
        run: scripts/perf-audit-allocation-profile.sh
      - name: compare proxy baseline
        id: compare_proxy_baseline
        continue-on-error: true
        run: scripts/compare-proxy-baseline.sh target/perf/perf-audit-proxy-compare.jsonl perf/baseline-proxy-compare.json
      - name: netem proxy comparison bench
        id: netem_proxy_comparison_bench
        continue-on-error: true
        env:
          QPX_NETEM_COMPARE_JSON: ${{ github.workspace }}/target/perf/perf-audit-netem-proxy-compare.jsonl
          QPX_NETEM_META_JSON: ${{ github.workspace }}/target/perf/perf-audit-netem-profile.jsonl
        run: scripts/perf-audit-netem-compare.sh "$QPX_NETEM_COMPARE_JSON"
      - name: http3 interop matrix
        id: http3_interop_matrix
        continue-on-error: true
        env:
          QPX_H3_INTEROP_JSON: ${{ github.workspace }}/target/perf/qpx-h3-interop-matrix.json
        run: scripts/h3-interop/run.sh all
      - name: callgrind hot path profile
        id: callgrind_hot_path_profile
        continue-on-error: true
        env:
          RUSTFLAGS: "-D warnings -C force-frame-pointers=yes"
          CARGO_PROFILE_RELEASE_DEBUG: "1"
          CARGO_PROFILE_RELEASE_STRIP: "none"
          QPX_PERF_PROFILE_JSON: ${{ github.workspace }}/target/perf/perf-audit-profile-summary.jsonl
          QPX_PERF_PROFILE_EVENTS: ${{ github.workspace }}/target/perf/perf-audit-profile-events.jsonl
        run: scripts/perf-audit-profile.sh
      - name: fail if any perf audit evaluation failed
        if: always()
        env:
          CRITERION_STREAMING_THROUGHPUT_BENCH: ${{ steps.criterion_streaming_throughput_bench.outcome }}
          H3_CRATE_PROTOCOL_PERF_BENCHMARKS: ${{ steps.h3_crate_protocol_perf_benchmarks.outcome }}
          QPX_HTTP3_PROTOCOL_PERF_BENCHMARKS: ${{ steps.qpx_http3_protocol_perf_benchmarks.outcome }}
          ADVANCED_TRANSPORT_PERF_BENCHMARKS: ${{ steps.advanced_transport_perf_benchmarks.outcome }}
          EXTERNAL_PROXY_COMPARISON_BENCH: ${{ steps.external_proxy_comparison_bench.outcome }}
          EXTERNAL_HTTP2_COMPARISON_BENCH: ${{ steps.external_http2_comparison_bench.outcome }}
          EXTERNAL_LONG_STREAMING_COMPARISON_BENCH: ${{ steps.external_long_streaming_comparison_bench.outcome }}
          ALLOCATION_PROFILE: ${{ steps.allocation_profile.outcome }}
          COMPARE_PROXY_BASELINE: ${{ steps.compare_proxy_baseline.outcome }}
          NETEM_PROXY_COMPARISON_BENCH: ${{ steps.netem_proxy_comparison_bench.outcome }}
          HTTP3_INTEROP_MATRIX: ${{ steps.http3_interop_matrix.outcome }}
          CALLGRIND_HOT_PATH_PROFILE: ${{ steps.callgrind_hot_path_profile.outcome }}
        run: |
          failed=0
          check_step() {
            label="$1"
            outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "$label failed: $outcome" >&2
              failed=1
            fi
          }
          check_step "criterion streaming throughput bench" "$CRITERION_STREAMING_THROUGHPUT_BENCH"
          check_step "h3 crate protocol perf benchmarks" "$H3_CRATE_PROTOCOL_PERF_BENCHMARKS"
          check_step "qpx http3 protocol perf benchmarks" "$QPX_HTTP3_PROTOCOL_PERF_BENCHMARKS"
          check_step "advanced transport perf benchmarks" "$ADVANCED_TRANSPORT_PERF_BENCHMARKS"
          check_step "external proxy comparison bench" "$EXTERNAL_PROXY_COMPARISON_BENCH"
          check_step "external http2 comparison bench" "$EXTERNAL_HTTP2_COMPARISON_BENCH"
          check_step "external long streaming comparison bench" "$EXTERNAL_LONG_STREAMING_COMPARISON_BENCH"
          check_step "allocation profile" "$ALLOCATION_PROFILE"
          check_step "compare proxy baseline" "$COMPARE_PROXY_BASELINE"
          check_step "netem proxy comparison bench" "$NETEM_PROXY_COMPARISON_BENCH"
          check_step "http3 interop matrix" "$HTTP3_INTEROP_MATRIX"
          check_step "callgrind hot path profile" "$CALLGRIND_HOT_PATH_PROFILE"
          exit "$failed"
      - name: upload perf audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qpx-perf-audit-jsonl
          path: |
            target/perf/*.jsonl
            target/perf/*.json
            target/perf/allocations/**
            target/perf/http2-compare-logs/**
            target/perf/netem-proxy-compare-logs/**
            target/perf/proxy-compare-logs/**
            target/perf/streaming-compare-logs/**
            target/perf/profiles/**
          if-no-files-found: ignore

  config_samples:
    name: config samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl
      - name: validate qpxd sample configs
        env:
          RUSTFLAGS: "-D warnings"
        run: bash ./scripts/check-config-samples.sh
      - name: audit qpxd sample use-case intent
        run: bash ./scripts/audit-config-usecases.sh
      - name: audit qpxd compiled sample behavior
        env:
          RUSTFLAGS: "-D warnings"
        run: bash ./scripts/audit-config-behavior.sh

  build_test:
    name: build/test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-2022
          - name: macos-aarch64
            os: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: build (no warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --workspace --all-targets --locked

      - name: test
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace --locked -- --test-threads=1

      - name: clippy (default features)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  release_target_preflight:
    name: release preflight (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            use_cross: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-preflight-${{ matrix.target }}
      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: build release targets (no warnings)
        env:
          RUSTFLAGS: "-D warnings"
          CARGO_TARGET_DIR: target/${{ matrix.target }}
          QPXD_SAMPLE_RUSTLS_FEATURES: qpxd/auth-digest,qpxd/auth-ldap
          QPXD_SAMPLE_NATIVE_FEATURES: auth-digest,auth-ldap
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --workspace --release --locked --target ${{ matrix.target }} --features "${QPXD_SAMPLE_RUSTLS_FEATURES}"
          else
            cargo build --workspace --release --locked --target ${{ matrix.target }} --features "${QPXD_SAMPLE_RUSTLS_FEATURES}"
          fi

          case "${{ matrix.target }}" in
            aarch64-apple-darwin|x86_64-pc-windows-msvc)
              cargo build -p qpxd --release --locked --target ${{ matrix.target }} --no-default-features --features "${QPXD_SAMPLE_NATIVE_FEATURES}"
              ;;
          esac

  clippy_feature_matrix:
    name: clippy (feature matrix, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy (all valid feature combinations)
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail

          run_clippy() {
            local pkg="$1"
            local features="${2:-}"

            if [[ -z "${features}" ]]; then
              echo "::group::cargo clippy -p ${pkg} --no-default-features"
              cargo clippy -p "${pkg}" --locked --all-targets --no-default-features -- -D warnings
              echo "::endgroup::"
              return 0
            fi

            echo "::group::cargo clippy -p ${pkg} --no-default-features --features ${features}"
            cargo clippy -p "${pkg}" --locked --all-targets --no-default-features --features "${features}" -- -D warnings
            echo "::endgroup::"
          }

          run_plain() {
            local pkg="$1"
            echo "::group::cargo clippy -p ${pkg}"
            cargo clippy -p "${pkg}" --locked --all-targets -- -D warnings
            echo "::endgroup::"
          }

          # qpx-core: tls backend (none|tls-rustls|tls-native) x ipc-support (on|off)
          for feats in \
            "" \
            "ipc-support" \
            "tls-rustls" \
            "tls-rustls,ipc-support" \
            "tls-native" \
            "tls-native,ipc-support"; do
            run_clippy qpx-core "${feats}"
          done

          # qpx-auth: explicit Basic / Digest / LDAP feature combinations
          for feats in \
            "" \
            "basic-auth" \
            "digest-auth" \
            "ldap-auth" \
            "ldap-auth,digest-auth"; do
            run_clippy qpx-auth "${feats}"
          done

          # qpx-acme: base or HTTP/3-enabled
          for feats in "" "http3"; do
            run_clippy qpx-acme "${feats}"
          done

          # qpxd:
          # - tls backend: none | tls-native | tls-rustls
          # - HTTP/3 defaults to h3; qpx takes precedence when both backend features are present
          # - mitm/acme require tls-rustls
          # - auth features are named auth-basic/auth-digest/auth-ldap
          for feats in \
            "" \
            "tls-native" \
            "tls-rustls" \
            "tls-rustls,auth-basic" \
            "tls-rustls,auth-digest" \
            "tls-rustls,auth-ldap" \
            "tls-native,auth-ldap" \
            "tls-rustls,mitm" \
            "tls-rustls,acme" \
            "tls-rustls,mitm,acme" \
            "http3-backend-h3" \
            "http3-backend-h3,mitm" \
            "http3-backend-h3,acme" \
            "http3-backend-h3,mitm,acme" \
            "http3-backend-qpx" \
            "http3-backend-qpx,mitm" \
            "http3-backend-qpx,acme" \
            "http3-backend-qpx,mitm,acme" \
            "http3-backend-h3,http3-backend-qpx,mitm,acme"; do
            run_clippy qpxd "${feats}"
          done

          # qpxr / qpxc: tls backend (none|tls-rustls|tls-native)
          for pkg in qpxr qpxc; do
            for tls in "" "tls-rustls" "tls-native"; do
              run_clippy "${pkg}" "${tls}"
            done
          done

          # qpxf: wasm (on|off)
          run_clippy qpxf ""
          run_clippy qpxf "wasm"

          # featureless crates
          for pkg in qpx-wasm qpx-h3 qpx-observability xtask; do
            run_plain "${pkg}"
          done

  audit:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
