name: performance diagnostics

on:
  push:
    branches: ["codex/**"]
    paths:
      - scripts/lib/perf-process-metrics.sh
      - scripts/lib/perf-process-fds.py
      - scripts/lib/perf-process-scheduler.py
      - scripts/check-perf-scheduler-accounting.sh
      - scripts/summarize-streaming-scheduler.py
      - scripts/lib/perf-thread-sampler.sh
      - scripts/check-perf-process-sampler.sh
      - scripts/perf-audit-streaming-compare.sh
      - qpxd/src/config_watch/**
  workflow_dispatch:
    inputs:
      category:
        description: Diagnostic workload; does not replace required CI gates
        type: choice
        options: [streaming, streaming-scheduler, streaming-window, streaming-affinity, streaming-mtu, streaming-mtu-normal, streaming-mtu-unpartitioned, streaming-mtu-window-unpartitioned, streaming-duration, streaming-revision, proxy-threads, proxy-phases, cache-writer-phases, cache-writeback, feature-callgrind, cache-miss-callgrind, proxy-native, feature-large-native, http1-native, http2-native, http2-phases, http2-worker-scaling, http2-worker-normal, http2-client, streaming-native, webdav-native, webdav-revision, cache-revision, http2-revision, webdav-sockets, webdav-scheduling, origin-cache, http2, http2-windows, http2-io, http2-events, http2-io-timeline, http2-mtu, http2-observer, http2-quality, http2-affinity, http2-balanced-affinity, scheduler-accounting]
        default: streaming
      baseline_ref:
        description: Baseline commit for a same-runner revision comparison
        type: string
        default: "9500bb1d764e8cee9b0b24bd9bea96ba512418fc"
      comparison_ref:
        description: Pinned current commit for revision comparisons; empty uses the workflow revision
        type: string
        default: ""
      revision_order:
        description: Version order for the same-runner origin/cache comparison
        type: choice
        options: [baseline-current, current-baseline]
        default: baseline-current
      profile_source_run:
        description: Existing http2-client or streaming-native run to reanalyze without repeating requests
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.comparison_ref || github.sha }}
      - name: validate and record comparison revision
        env:
          COMPARISON_REF: ${{ inputs.comparison_ref }}
          CATEGORY: ${{ inputs.category }}
          SOURCE_RUN: ${{ inputs.profile_source_run }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [ -n "$COMPARISON_REF" ]; then
            case "$CATEGORY" in
              webdav-revision|cache-revision|http2-revision|streaming-revision) ;;
              *) echo "pinned comparison revisions require a revision comparison category" >&2; exit 1 ;;
            esac
            if [ -n "$SOURCE_RUN" ]; then
              echo "pinned comparison revisions cannot be combined with retained profile analysis" >&2
              exit 1
            fi
          fi
          COMPARISON_SHA="$(git rev-parse HEAD)"
          export COMPARISON_SHA
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path("target/perf")
          output.mkdir(parents=True, exist_ok=True)
          record = {name.lower(): os.environ[name] for name in (
              "WORKFLOW_SHA", "COMPARISON_SHA", "COMPARISON_REF", "CATEGORY")}
          (output / "comparison-revision.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf-audit-streaming
      - name: verify real process resource sampling
        run: |
          bash scripts/check-perf-process-sampler.sh
          python3 scripts/check-perf-deadline.py
          python3 scripts/check-streaming-client-failure.py
      - name: record environment
        run: bash scripts/check-perf-runner.sh
      - name: install comparison dependencies
        if: inputs.category != 'scheduler-accounting'
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-utils lighttpd nginx nghttp2-client openssl squid strace time valgrind wrk jq
      - name: verify native CPU profiler before build
        if: inputs.category == 'proxy-native' || inputs.category == 'feature-large-native' || inputs.category == 'http1-native' || inputs.category == 'http2-native' || inputs.category == 'http2-client' || inputs.category == 'streaming-native' || inputs.category == 'webdav-native' || (inputs.category == 'http2-events' || inputs.category == 'http2-io-timeline')
        run: |
          if [[ "${{ inputs.category }}" = http2-events || "${{ inputs.category }}" = http2-io-timeline ]]; then
            sudo apt-get install -y "linux-tools-$(uname -r)" ripgrep
          else
            sudo apt-get install -y linux-tools-generic ripgrep
          fi
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          mkdir -p target/perf
          dpkg-query -W -f='${binary:Package}\t${db:Status-Status}\n' 'linux-tools-*' > target/perf/native-perf-packages.txt
          mapfile -t perf_packages < <(awk '$2 == "installed" { print $1 }' target/perf/native-perf-packages.txt)
          if [ "${#perf_packages[@]}" -eq 0 ]; then
            echo "native perf packages are missing" >&2
            exit 1
          fi
          dpkg-query -L "${perf_packages[@]}" > target/perf/native-perf-package-files.txt
          if [[ "${{ inputs.category }}" = http2-events || "${{ inputs.category }}" = http2-io-timeline ]]; then
            kernel_release="$(uname -r)"
            kernel_tools_dir="/usr/lib/linux-tools/$kernel_release"
            if ! rg -F -x -q "$kernel_tools_dir" target/perf/native-perf-package-files.txt; then
              echo "kernel-matched tools directory is not owned by an installed package" >&2
              exit 1
            fi
            perf_binary="$kernel_tools_dir/perf"
          else
            mapfile -t perf_tools < <(rg '^/usr/lib/linux-tools[^[:space:]]*/perf$' target/perf/native-perf-package-files.txt | sort -V)
            if [ "${#perf_tools[@]}" -eq 0 ]; then
              echo "native perf executable is missing" >&2
              exit 1
            fi
            perf_binary="${perf_tools[-1]}"
          fi
          if [ ! -f "$perf_binary" ] || [ ! -x "$perf_binary" ]; then
            echo "native perf path is not an executable file: $perf_binary" >&2
            exit 1
          fi
          "$perf_binary" --version
          "$perf_binary" record -e cpu-clock -F 199 --clockid CLOCK_MONOTONIC \
            --call-graph dwarf,16384 -o target/perf/native-perf-probe.data \
            -- python3 -c $'import time\nend = time.monotonic() + 0.1\nwhile time.monotonic() < end:\n    pass'
          if [[ "${{ inputs.category }}" = http2-events || "${{ inputs.category }}" = http2-io-timeline ]]; then
            if ! mountpoint -q /sys/kernel/tracing; then
              sudo mount -t tracefs tracefs /sys/kernel/tracing
            fi
            sudo chmod a+rx /sys/kernel/tracing /sys/kernel/tracing/events
            sudo chmod -R a+rX /sys/kernel/tracing/events/syscalls /sys/kernel/tracing/events/ftrace /sys/kernel/tracing/events/tcp
            sudo chmod a+r /sys/kernel/tracing/events/header_page /sys/kernel/tracing/events/header_event \
              /sys/kernel/tracing/printk_formats /sys/kernel/tracing/saved_cmdlines
            if [ "${{ inputs.category }}" = http2-io-timeline ]; then
              QPX_PERF_NATIVE_IO_TIMELINE=1 QPX_NATIVE_PERF_BIN="$perf_binary" \
                bash scripts/perf-diagnose-http2-events.sh --probe-only
            else
              QPX_NATIVE_PERF_BIN="$perf_binary" bash scripts/perf-diagnose-http2-events.sh --probe-only
            fi
          fi
          echo "QPX_NATIVE_PERF_BIN=$perf_binary" >> "$GITHUB_ENV"
      - name: build before measurement
        if: inputs.category != 'scheduler-accounting' && inputs.profile_source_run == ''
        run: |
          if [[ "$CATEGORY" = *-callgrind || "$CATEGORY" = *-native ]]; then
            cargo build -p qpxd --profile callgrind --locked --features http3-backend-qpx
          else
            cargo build -p qpxd --release --locked --features http3-backend-qpx
          fi
        env:
          CATEGORY: ${{ inputs.category || 'streaming-scheduler' }}
          RUSTFLAGS: "-D warnings"
      - name: build comparison baseline before measurement
        id: baseline
        if: inputs.category == 'webdav-revision' || inputs.category == 'cache-revision' || inputs.category == 'http2-revision' || inputs.category == 'streaming-revision'
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          RUSTFLAGS: "-D warnings"
        run: |
          baseline_sha="$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")"
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          git worktree add --detach target/perf-baseline "$baseline_sha"
          cd target/perf-baseline
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/perf-baseline-build" cargo build -p qpxd --release --locked --features http3-backend-qpx
      - name: validate existing profile source
        if: inputs.profile_source_run != ''
        env:
          SOURCE_RUN: ${{ inputs.profile_source_run }}
          CATEGORY: ${{ inputs.category }}
        run: |
          if { [ "$CATEGORY" != http2-client ] && [ "$CATEGORY" != streaming-native ]; } || [[ ! "$SOURCE_RUN" =~ ^[0-9]+$ ]]; then
            echo "existing profile analysis requires http2-client or streaming-native and a numeric run ID" >&2
            exit 1
          fi
      - name: download existing CPU profiles
        if: inputs.profile_source_run != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ format('performance-diagnostics-{0}', inputs.category) }}
          path: target/perf
          run-id: ${{ inputs.profile_source_run }}
          github-token: ${{ github.token }}
      - name: diagnostic comparison
        if: inputs.profile_source_run == ''
        env:
          QPX_PERF_BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          QPX_PERF_BASELINE_BIN: ${{ github.workspace }}/target/perf-baseline-build/release/qpxd
          CATEGORY: ${{ inputs.category || 'streaming-scheduler' }}
          REVISION_ORDER: ${{ inputs.revision_order }}
        run: |
          case "$CATEGORY" in
            webdav-revision|cache-revision|http2-revision|streaming-revision)
              GITHUB_SHA="$(git rev-parse HEAD)"
              export GITHUB_SHA
              ;;
          esac
          case "$CATEGORY" in
            scheduler-accounting)
              python3 scripts/perf-evaluate.py "completed thread scheduler accounting" -- bash scripts/check-perf-scheduler-accounting.sh
              cp target/perf/scheduler-accounting-probe.json target/perf/scheduler-accounting-host-probe.json
              python3 scripts/perf-evaluate.py "isolated network scheduler accounting" -- sudo -n unshare --net bash scripts/check-perf-scheduler-accounting.sh
              ;;
            streaming)
              python3 scripts/perf-evaluate.py "streaming diagnostics" -- bash scripts/perf-audit-streaming-compare.sh
              python3 scripts/perf-evaluate.py "streaming diagnostic objectives" -- bash scripts/check-streaming-performance.sh target/perf/perf-audit-streaming-compare.jsonl
              ;;
            streaming-scheduler)
              QPX_PERF_SCHEDULER_THREADS=1 QPX_STREAMING_COMPARE_NATIVE_DIAGNOSTICS=1 \
                python3 scripts/perf-evaluate.py "streaming thread scheduler diagnostics" -- bash scripts/perf-audit-streaming-compare.sh
              python3 scripts/summarize-streaming-scheduler.py target/perf/streaming-compare-logs target/perf/streaming-scheduler-summary.json
              ;;
            origin-cache)
              QPX_PROXY_COMPARE_PROXY_FILTER=qpxd-local,nginx-static,qpxd-cache,nginx-cache,qpxd-feature-rich,nginx-feature-rich,qpxd-webdav,apache-webdav \
                QPX_PROXY_COMPARE_BODY_SIZES="1024 1048576" \
                QPX_PROXY_COMPARE_MISS_SAMPLE_ATTEMPTS=5 \
                python3 scripts/perf-evaluate.py "origin and cache comparison" -- bash scripts/perf-audit-proxy-compare.sh
              python3 scripts/perf-evaluate.py "origin and cache objectives" -- bash scripts/check-origin-cache-performance.sh target/perf/perf-audit-proxy-compare.jsonl
              ;;
            streaming-window)
              case "$REVISION_ORDER" in
                baseline-current) export QPX_STREAMING_WINDOW_ORDER=normal-extended ;;
                current-baseline) export QPX_STREAMING_WINDOW_ORDER=extended-normal ;;
                *) echo "unsupported streaming window order: $REVISION_ORDER" >&2; exit 2 ;;
              esac
              python3 scripts/perf-evaluate.py "streaming same-runner window diagnostics" -- bash scripts/perf-diagnose-streaming-window.sh
              ;;
            streaming-affinity)
              failed=0
              python3 scripts/perf-evaluate.py "streaming CPU partition diagnostic measurement" -- bash scripts/perf-diagnose-streaming-affinity.sh || failed=1
              python3 scripts/perf-evaluate.py "streaming CPU partition diagnostic objectives" -- \
                bash scripts/check-streaming-performance.sh target/perf/perf-audit-streaming-compare.jsonl perf/streaming-performance-objectives.json window-diagnostic || failed=1
              exit "$failed"
              ;;
            streaming-mtu-normal)
              python3 scripts/perf-evaluate.py "streaming normal workload same-runner MTU diagnostics" -- timeout --signal=TERM --kill-after=40s 12m bash scripts/perf-diagnose-streaming-mtu.sh --normal
              ;;
            streaming-mtu-unpartitioned)
              case "$REVISION_ORDER" in
                baseline-current) export QPX_STREAMING_MTU_ORDER=65536-1500 ;;
                current-baseline) export QPX_STREAMING_MTU_ORDER=1500-65536 ;;
                *) echo "unsupported streaming MTU order: $REVISION_ORDER" >&2; exit 2 ;;
              esac
              python3 scripts/perf-evaluate.py "streaming normal CPU scheduling same-runner MTU diagnostics" -- timeout --signal=TERM --kill-after=40s 12m bash scripts/perf-diagnose-streaming-mtu.sh --unpartitioned-normal
              ;;
            streaming-mtu-window-unpartitioned)
              python3 scripts/perf-evaluate.py "streaming normal CPU scheduling MTU 1500 extended window diagnostics" -- timeout --signal=TERM --kill-after=40s 12m bash scripts/perf-diagnose-streaming-mtu.sh --unpartitioned-window
              ;;
            streaming-mtu)
              python3 scripts/perf-evaluate.py "streaming same-runner MTU diagnostics" -- timeout --signal=TERM --kill-after=40s 28m bash scripts/perf-diagnose-streaming-mtu.sh
              ;;
            streaming-duration)
              QPX_STREAMING_COMPARE_FAST_TRANSFERS=512 \
                python3 scripts/perf-evaluate.py "extended streaming measurement" -- bash scripts/perf-audit-streaming-compare.sh
              failed=0
              python3 scripts/perf-evaluate.py "extended streaming measurement quality" -- \
                bash scripts/check-streaming-performance.sh target/perf/perf-audit-streaming-compare.jsonl perf/streaming-performance-objectives.json measurement-quality || failed=1
              python3 scripts/perf-evaluate.py "extended streaming existing acceptance" -- \
                bash scripts/check-streaming-performance.sh target/perf/perf-audit-streaming-compare.jsonl perf/streaming-performance-objectives.json || failed=1
              exit "$failed"
              ;;
            streaming-revision)
              case "$REVISION_ORDER" in
                baseline-current) export QPX_PERF_REPETITION=1 ;;
                current-baseline) export QPX_PERF_REPETITION=2 ;;
                *) echo "unsupported streaming revision order: $REVISION_ORDER" >&2; exit 2 ;;
              esac
              failed=0
              python3 scripts/perf-evaluate.py "streaming same-runner revision comparison" -- bash scripts/perf-audit-revision-compare.sh streaming target/perf/perf-audit-streaming-compare.jsonl || failed=1
              python3 scripts/perf-evaluate.py "current streaming revision objectives" -- bash scripts/check-streaming-performance.sh target/perf/perf-audit-streaming-compare.jsonl || failed=1
              exit "$failed"
              ;;
            proxy-threads)
              QPX_PROXY_COMPARE_THREAD_DIAGNOSTICS=1 python3 scripts/perf-evaluate.py "thread diagnostics" -- bash scripts/perf-audit-proxy-matrix.sh
              ;;
            cache-writer-phases)
              RUST_LOG=warn,qpx_perf_phase=debug QPX_PROXY_COMPARE_THREAD_DIAGNOSTICS=1 \
                QPX_PROXY_COMPARE_PROXY_FILTER=qpxd-cache,nginx-cache \
                QPX_PROXY_COMPARE_BODY_SIZES=1024 \
                QPX_PROXY_COMPARE_MISS_SAMPLE_ATTEMPTS=5 \
                python3 scripts/perf-evaluate.py "1 KiB cache writer CPU and wait diagnostics" -- bash scripts/perf-audit-proxy-compare.sh
              python3 scripts/summarize-perf-phases.py target/perf/proxy-compare-logs target/perf/phase-summary.json
              jq -e 'any(.[]; .phase == "cache_writer_execution" and .observed_sync_cpu_samples == .samples and .samples > 0)' target/perf/phase-summary.json
              ;;
            cache-writeback)
              QPX_PROXY_COMPARE_THREAD_DIAGNOSTICS=1 QPX_PROXY_COMPARE_WRITEBACK_DIAGNOSTICS=1 \
                QPX_PROXY_COMPARE_PROXY_FILTER=qpxd-cache,nginx-cache \
                QPX_PROXY_COMPARE_BODY_SIZES=1024 \
                QPX_PROXY_COMPARE_SAMPLE_ATTEMPTS=3 QPX_PROXY_COMPARE_MISS_SAMPLE_ATTEMPTS=3 \
                python3 scripts/perf-evaluate.py "cache writeback admission diagnostics" -- bash scripts/perf-audit-proxy-compare.sh
              ;;
            proxy-phases)
              RUST_LOG=warn,qpx_perf_phase=debug \
                QPX_PROXY_COMPARE_THREAD_DIAGNOSTICS=1 \
                QPX_PROXY_COMPARE_PROXY_FILTER=qpxd-local,nginx-static,qpxd-cache,nginx-cache,qpxd-feature-rich,nginx-feature-rich,qpxd-webdav,apache-webdav \
                QPX_PROXY_COMPARE_BODY_SIZES="1024 1048576" \
                python3 scripts/perf-evaluate.py "phase diagnostics" -- bash scripts/perf-audit-proxy-compare.sh
              python3 scripts/summarize-perf-phases.py target/perf/proxy-compare-logs target/perf/phase-summary.json
              ;;
            webdav-revision)
              QPX_PERF_REVISION_ORDER="${{ inputs.revision_order }}" \
                python3 scripts/perf-evaluate.py "WebDAV same-runner revision objectives" -- bash scripts/perf-diagnose-origin-cache-revision.sh
              ;;
            cache-revision)
              QPX_PERF_REVISION_WORKLOAD=cache QPX_PERF_REVISION_ORDER="${{ inputs.revision_order }}" \
                python3 scripts/perf-evaluate.py "cache same-runner revision objectives" -- bash scripts/perf-diagnose-origin-cache-revision.sh
              ;;
            http2-revision)
              case "$REVISION_ORDER" in
                baseline-current) export QPX_PERF_REPETITION=1 ;;
                current-baseline) export QPX_PERF_REPETITION=2 ;;
                *) echo "unsupported HTTP/2 revision order: $REVISION_ORDER" >&2; exit 2 ;;
              esac
              failed=0
              python3 scripts/perf-evaluate.py "HTTP/2 isolated same-runner revision comparison" -- bash scripts/perf-audit-revision-compare.sh http2 target/perf/perf-audit-http2-compare.jsonl || failed=1
              python3 scripts/perf-evaluate.py "current isolated HTTP/2 revision objectives" -- bash scripts/check-http2-performance.sh target/perf/perf-audit-http2-compare.jsonl || failed=1
              exit "$failed"
              ;;
            webdav-scheduling)
              RUST_LOG=warn,qpx_perf_phase=debug QPX_PROXY_COMPARE_THREAD_DIAGNOSTICS=1 \
                QPX_PROXY_COMPARE_PROXY_FILTER=qpxd-webdav,apache-webdav \
                QPX_PROXY_COMPARE_BODY_SIZES=1048576 \
                QPX_PROXY_COMPARE_SAMPLE_ATTEMPTS=3 \
                python3 scripts/perf-evaluate.py "WebDAV file-body scheduling diagnostics" -- bash scripts/perf-audit-proxy-compare.sh
              python3 scripts/summarize-perf-phases.py target/perf/proxy-compare-logs target/perf/phase-summary.json
              ;;
            webdav-sockets)
              QPX_PROXY_COMPARE_THREAD_DIAGNOSTICS=1 QPX_PERF_WEBDAV_SOCKET_DIAGNOSTICS=1 \
                QPX_PROXY_COMPARE_PROXY_FILTER=qpxd-webdav,apache-webdav \
                QPX_PROXY_COMPARE_BODY_SIZES="1024 1048576" \
                QPX_PROXY_COMPARE_WEBDAV_QPXD_ENV="MALLOC_ARENA_MAX=2 MALLOC_TRIM_THRESHOLD_=134217728" \
                python3 scripts/perf-evaluate.py "WebDAV socket diagnostics" -- bash scripts/perf-audit-proxy-compare.sh
              python3 scripts/summarize-perf-sockets.py target/perf/proxy-compare-logs target/perf/webdav-socket-summary.json
              ;;
            feature-callgrind)
              python3 scripts/perf-evaluate.py "feature-rich callgrind diagnostics" -- bash scripts/perf-diagnose-proxy-callgrind.sh
              ;;
            cache-miss-callgrind)
              QPX_CALLGRIND_WORKLOAD=cache-miss python3 scripts/perf-evaluate.py "cache miss callgrind diagnostics" -- bash scripts/perf-diagnose-proxy-callgrind.sh
              ;;
            proxy-native)
              python3 scripts/perf-evaluate.py "native CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              ;;
            feature-large-native)
              QPX_NATIVE_WORKLOAD=feature-large python3 scripts/perf-evaluate.py "native feature-rich 1 MiB CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              ;;
            http1-native)
              QPX_NATIVE_WORKLOAD=http1 python3 scripts/perf-evaluate.py "native HTTP/1 CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              ;;
            webdav-native)
              QPX_NATIVE_WORKLOAD=webdav python3 scripts/perf-evaluate.py "native WebDAV CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              ;;
            http2-phases)
              QPX_PERF_NATIVE_IO_TIMELINE=1 python3 scripts/perf-evaluate.py "isolated HTTP/2 phase diagnostics" -- bash scripts/perf-audit-http2-isolated.sh --phases target/perf/perf-audit-http2-compare.jsonl
              python3 scripts/summarize-http2-phases.py target/perf/http2-compare-logs target/perf/http2-phase-summary.json
              python3 scripts/summarize-perf-phases.py target/perf/http2-compare-logs target/perf/http2-poll-summary.json
              jq -e 'any(.[]; .phase == "h2_connection_poll" and .observed_future_samples > 0 and .max_active_poll_ns.max > 0)' target/perf/http2-poll-summary.json
              ;;
            http2-worker-scaling)
              for workers in 4 1 2; do
                evidence="target/perf/http2-worker-scaling/workers-${workers}"
                mkdir -p "$evidence"
                QPX_HTTP2_COMPARE_LOG_DIR="$PWD/$evidence/logs" \
                  python3 scripts/perf-evaluate.py "HTTP/2 ${workers}-worker phase diagnostics" -- \
                  bash scripts/perf-audit-http2-isolated.sh --phases --workers "$workers" "$evidence/comparison.jsonl"
                python3 scripts/summarize-http2-phases.py "$evidence/logs" "$evidence/phases.json"
              done
              ;;
            http2-worker-normal)
              evidence="target/perf/http2-worker-normal/workers-1"
              mkdir -p "$evidence"
              QPX_PERF_MEMORY_MAP_DIAGNOSTICS=1 QPX_HTTP2_COMPARE_LOG_DIR="$PWD/$evidence/logs" \
                python3 scripts/perf-evaluate.py "uninstrumented single-worker HTTP/2 comparison" -- \
                bash scripts/perf-audit-http2-isolated.sh --workers 1 "$evidence/comparison.jsonl"
              failed=0
              python3 scripts/perf-evaluate.py "single-worker HTTP/2 measurement quality" -- \
                bash scripts/check-http2-performance.sh "$evidence/comparison.jsonl" perf/http2-performance-objectives.json measurement-quality || failed=1
              python3 scripts/perf-evaluate.py "single-worker HTTP/2 existing objectives" -- \
                bash scripts/check-http2-performance.sh "$evidence/comparison.jsonl" || failed=1
              exit "$failed"
              ;;
            http2-native)
              QPX_NATIVE_WORKLOAD=http2 python3 scripts/perf-evaluate.py "native HTTP/2 CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              ;;
            streaming-native)
              QPX_NATIVE_WORKLOAD=streaming RUST_LOG=warn,qpx_perf_splice=debug python3 scripts/perf-evaluate.py "native streaming CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              python3 scripts/summarize-splice-batches.py target/perf/streaming-compare-logs/qpxd.log target/perf/splice-counter-summary.json
              ;;
            http2-io-timeline)
              RUST_LOG=warn,qpx_perf_phase=debug QPX_PERF_NATIVE_IO_TIMELINE=1 \
                QPX_HTTP2_COMPARE_BODY_SIZES=1024 \
                python3 scripts/perf-evaluate.py "HTTP/2 real TCP arrival and notification timeline" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-events.sh
              ;;
            http2-events)
              python3 scripts/perf-evaluate.py "HTTP/2 kernel wait events" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-events.sh
              ;;
            http2-mtu)
              python3 scripts/perf-evaluate.py "HTTP/2 isolated MTU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh
              ;;
            http2-observer)
              python3 scripts/perf-evaluate.py "HTTP/2 observer effect diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh --observer
              ;;
            http2-quality)
              python3 scripts/perf-evaluate.py "HTTP/2 complete matrix quality diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh --full
              ;;
            http2-affinity)
              python3 scripts/perf-evaluate.py "HTTP/2 CPU partition quality diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh --full-affinity
              ;;
            http2-balanced-affinity)
              python3 scripts/perf-evaluate.py "HTTP/2 balanced CPU partition diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh --balanced-affinity
              ;;
            http2-client)
              python3 scripts/perf-evaluate.py "HTTP/2 load-generator CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh --full-client
              ;;
            http2-io)
              python3 scripts/perf-evaluate.py "HTTP/2 syscall wait diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-io.sh
              ;;
            http2-windows)
              python3 scripts/perf-evaluate.py "HTTP/2 client window diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-window.sh
              ;;
            http2)
              python3 scripts/perf-evaluate.py "http2 diagnostics" -- bash scripts/perf-audit-http2-compare.sh
              python3 scripts/perf-evaluate.py "http2 diagnostic objectives" -- bash scripts/check-http2-performance.sh target/perf/perf-audit-http2-compare.jsonl
              ;;
            *) echo "unsupported diagnostic category: $CATEGORY" >&2; exit 2 ;;
          esac
      - name: decode retained native streaming CPU profiles
        if: inputs.category == 'streaming-native' && inputs.profile_source_run != ''
        env:
          SOURCE_RUN: ${{ inputs.profile_source_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          profiles=(target/perf/profiles/native.*)
          if [ "${#profiles[@]}" -ne 1 ] || [ ! -d "${profiles[0]}" ]; then
            echo "native CPU profile directory is missing or ambiguous" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > target/perf/native-source-run.json
          python3 scripts/restore-native-profile-binary.py "${profiles[0]}" "$GITHUB_WORKSPACE" target/perf/native-source-run.json
          status=0
          bash scripts/perf-report-proxy-native.sh streaming "${profiles[0]}" \
            "$GITHUB_WORKSPACE/target/perf/streaming-compare-logs" || status=1
          python3 scripts/summarize-splice-batches.py target/perf/streaming-compare-logs/qpxd.log \
            target/perf/splice-counter-summary.json || status=1
          exit "$status"
      - name: summarize retained load-generator CPU profiles
        if: always() && inputs.category == 'http2-client'
        env:
          SOURCE_RUN: ${{ inputs.profile_source_run }}
        run: |
          profiles=(target/perf/profiles/http2-mtu.*/client-profiles)
          if [ "${#profiles[@]}" -ne 1 ] || [ ! -d "${profiles[0]}" ]; then
            echo "load-generator CPU profile directory is missing or ambiguous" >&2
            exit 1
          fi
          status=0
          python3 scripts/summarize-perf-client.py "${profiles[0]}" "$QPX_NATIVE_PERF_BIN" || status=1
          phase="${profiles[0]%/client-profiles}/mtu-1500-full"
          bash scripts/check-http2-performance.sh "$phase/comparison.jsonl" \
            perf/http2-performance-objectives.json diagnostic-quality "$phase/manifest.json" \
            > "$phase/client-profile-quality.log" 2>&1 || status=1
          cat "$phase/client-profile-quality.log"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("target/perf/client-profile-analysis.json").write_text(json.dumps({
              "source_run": os.environ["SOURCE_RUN"] or os.environ["GITHUB_RUN_ID"],
              "analysis_commit": os.environ["GITHUB_SHA"],
              "analysis_run": os.environ["GITHUB_RUN_ID"],
              "replaces_required_gate": False,
          }, indent=2) + "\n")
          PY
          exit "$status"
      - name: summarize retained cache writeback counters
        if: always() && inputs.category == 'cache-writeback'
        run: python3 scripts/summarize-perf-writeback.py target/perf/proxy-compare-logs target/perf/cache-writeback-summary.json
      - name: upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-diagnostics-${{ inputs.category || 'streaming-scheduler' }}
          path: target/perf/**
          if-no-files-found: error
