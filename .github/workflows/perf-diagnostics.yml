name: performance diagnostics

on:
  push:
    branches: ["codex/**"]
    paths:
      - .github/workflows/perf-diagnostics.yml
      - scripts/lib/perf-process-metrics.sh
      - scripts/lib/perf-process-fds.py
      - scripts/lib/perf-process-scheduler.py
      - scripts/check-perf-scheduler-accounting.sh
      - scripts/lib/perf-thread-sampler.sh
      - scripts/check-perf-process-sampler.sh
      - scripts/perf-audit-streaming-compare.sh
      - qpxd/src/config_watch/**
  workflow_dispatch:
    inputs:
      category:
        description: Diagnostic workload; does not replace required CI gates
        type: choice
        options: [streaming, proxy-threads, proxy-phases, feature-callgrind, cache-miss-callgrind, proxy-native, http2-native, http2-client, streaming-native, webdav-native, webdav-revision, webdav-sockets, origin-cache, http2, http2-windows, http2-io, http2-events, http2-mtu, http2-observer, http2-quality, http2-affinity, scheduler-accounting]
        default: streaming
      baseline_ref:
        description: Baseline commit for the same-runner WebDAV comparison
        type: string
        default: "9500bb1d764e8cee9b0b24bd9bea96ba512418fc"
      revision_order:
        description: Version order for the same-runner WebDAV comparison
        type: choice
        options: [baseline-current, current-baseline]
        default: baseline-current

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf-audit-streaming
      - name: verify real process resource sampling
        run: bash scripts/check-perf-process-sampler.sh
      - name: record environment
        run: bash scripts/check-perf-runner.sh
      - name: install comparison dependencies
        if: inputs.category != 'scheduler-accounting'
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 apache2-utils lighttpd nginx nghttp2-client openssl squid strace time valgrind wrk jq
      - name: verify native CPU profiler before build
        if: inputs.category == 'proxy-native' || inputs.category == 'http2-native' || inputs.category == 'http2-client' || inputs.category == 'streaming-native' || inputs.category == 'webdav-native' || inputs.category == 'http2-events'
        run: |
          if [ "${{ inputs.category }}" = http2-events ]; then
            sudo apt-get install -y "linux-tools-$(uname -r)" ripgrep
          else
            sudo apt-get install -y linux-tools-generic ripgrep
          fi
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          mkdir -p target/perf
          dpkg-query -W -f='${binary:Package}\t${db:Status-Status}\n' 'linux-tools-*' > target/perf/native-perf-packages.txt
          mapfile -t perf_packages < <(awk '$2 == "installed" { print $1 }' target/perf/native-perf-packages.txt)
          if [ "${#perf_packages[@]}" -eq 0 ]; then
            echo "native perf packages are missing" >&2
            exit 1
          fi
          dpkg-query -L "${perf_packages[@]}" > target/perf/native-perf-package-files.txt
          if [ "${{ inputs.category }}" = http2-events ]; then
            kernel_release="$(uname -r)"
            kernel_tools_dir="/usr/lib/linux-tools/$kernel_release"
            if ! rg -F -x -q "$kernel_tools_dir" target/perf/native-perf-package-files.txt; then
              echo "kernel-matched tools directory is not owned by an installed package" >&2
              exit 1
            fi
            perf_binary="$kernel_tools_dir/perf"
          else
            mapfile -t perf_tools < <(rg '^/usr/lib/linux-tools[^[:space:]]*/perf$' target/perf/native-perf-package-files.txt | sort -V)
            if [ "${#perf_tools[@]}" -eq 0 ]; then
              echo "native perf executable is missing" >&2
              exit 1
            fi
            perf_binary="${perf_tools[-1]}"
          fi
          if [ ! -f "$perf_binary" ] || [ ! -x "$perf_binary" ]; then
            echo "native perf path is not an executable file: $perf_binary" >&2
            exit 1
          fi
          "$perf_binary" --version
          "$perf_binary" record -e cpu-clock -F 199 --clockid CLOCK_MONOTONIC \
            --call-graph dwarf,16384 -o target/perf/native-perf-probe.data \
            -- python3 -c $'import time\nend = time.monotonic() + 0.1\nwhile time.monotonic() < end:\n    pass'
          if [ "${{ inputs.category }}" = http2-events ]; then
            if ! mountpoint -q /sys/kernel/tracing; then
              sudo mount -t tracefs tracefs /sys/kernel/tracing
            fi
            sudo chmod a+rx /sys/kernel/tracing /sys/kernel/tracing/events
            sudo chmod -R a+rX /sys/kernel/tracing/events/syscalls /sys/kernel/tracing/events/ftrace /sys/kernel/tracing/events/tcp
            sudo chmod a+r /sys/kernel/tracing/events/header_page /sys/kernel/tracing/events/header_event \
              /sys/kernel/tracing/printk_formats /sys/kernel/tracing/saved_cmdlines
            QPX_NATIVE_PERF_BIN="$perf_binary" bash scripts/perf-diagnose-http2-events.sh --probe-only
          fi
          echo "QPX_NATIVE_PERF_BIN=$perf_binary" >> "$GITHUB_ENV"
      - name: build before measurement
        if: inputs.category != 'scheduler-accounting'
        run: |
          if [[ "$CATEGORY" = *-callgrind || "$CATEGORY" = *-native ]]; then
            cargo build -p qpxd --profile callgrind --locked --features http3-backend-qpx
          else
            cargo build -p qpxd --release --locked --features http3-backend-qpx
          fi
        env:
          CATEGORY: ${{ inputs.category || 'streaming' }}
          RUSTFLAGS: "-D warnings"
      - name: build WebDAV baseline before measurement
        id: baseline
        if: inputs.category == 'webdav-revision'
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          RUSTFLAGS: "-D warnings"
        run: |
          baseline_sha="$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")"
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          git worktree add --detach target/perf-baseline "$baseline_sha"
          cd target/perf-baseline
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/perf-baseline-build" cargo build -p qpxd --release --locked --features http3-backend-qpx
      - name: diagnostic comparison
        env:
          QPX_PERF_BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          QPX_PERF_BASELINE_BIN: ${{ github.workspace }}/target/perf-baseline-build/release/qpxd
          CATEGORY: ${{ inputs.category || 'streaming' }}
        run: |
          case "$CATEGORY" in
            scheduler-accounting)
              python3 scripts/perf-evaluate.py "completed thread scheduler accounting" -- bash scripts/check-perf-scheduler-accounting.sh
              cp target/perf/scheduler-accounting-probe.json target/perf/scheduler-accounting-host-probe.json
              python3 scripts/perf-evaluate.py "isolated network scheduler accounting" -- sudo -n unshare --net bash scripts/check-perf-scheduler-accounting.sh
              ;;
            streaming)
              python3 scripts/perf-evaluate.py "streaming diagnostics" -- bash scripts/perf-audit-streaming-compare.sh
              python3 scripts/perf-evaluate.py "streaming diagnostic objectives" -- bash scripts/check-streaming-performance.sh target/perf/perf-audit-streaming-compare.jsonl
              ;;
            origin-cache)
              QPX_PROXY_COMPARE_PROXY_FILTER=qpxd-local,nginx-static,qpxd-cache,nginx-cache,qpxd-feature-rich,nginx-feature-rich,qpxd-webdav,apache-webdav \
                QPX_PROXY_COMPARE_BODY_SIZES="1024 1048576" \
                QPX_PROXY_COMPARE_MISS_SAMPLE_ATTEMPTS=5 \
                python3 scripts/perf-evaluate.py "origin and cache comparison" -- bash scripts/perf-audit-proxy-compare.sh
              python3 scripts/perf-evaluate.py "origin and cache objectives" -- bash scripts/check-origin-cache-performance.sh target/perf/perf-audit-proxy-compare.jsonl
              ;;
            proxy-threads)
              QPX_PROXY_COMPARE_THREAD_DIAGNOSTICS=1 python3 scripts/perf-evaluate.py "thread diagnostics" -- bash scripts/perf-audit-proxy-matrix.sh
              ;;
            proxy-phases)
              RUST_LOG=warn,qpx_perf_phase=debug \
                QPX_PROXY_COMPARE_THREAD_DIAGNOSTICS=1 \
                QPX_PROXY_COMPARE_PROXY_FILTER=qpxd-local,nginx-static,qpxd-cache,nginx-cache,qpxd-feature-rich,nginx-feature-rich,qpxd-webdav,apache-webdav \
                QPX_PROXY_COMPARE_BODY_SIZES="1024 1048576" \
                python3 scripts/perf-evaluate.py "phase diagnostics" -- bash scripts/perf-audit-proxy-compare.sh
              python3 scripts/summarize-perf-phases.py target/perf/proxy-compare-logs target/perf/phase-summary.json
              ;;
            webdav-revision)
              QPX_PERF_REVISION_ORDER="${{ inputs.revision_order }}" \
                python3 scripts/perf-evaluate.py "WebDAV same-runner revision objectives" -- bash scripts/perf-diagnose-webdav-revision.sh
              ;;
            webdav-sockets)
              QPX_PROXY_COMPARE_THREAD_DIAGNOSTICS=1 QPX_PERF_WEBDAV_SOCKET_DIAGNOSTICS=1 \
                QPX_PROXY_COMPARE_PROXY_FILTER=qpxd-webdav,apache-webdav \
                QPX_PROXY_COMPARE_BODY_SIZES="1024 1048576" \
                QPX_PROXY_COMPARE_WEBDAV_QPXD_ENV="MALLOC_ARENA_MAX=2 MALLOC_TRIM_THRESHOLD_=134217728" \
                python3 scripts/perf-evaluate.py "WebDAV socket diagnostics" -- bash scripts/perf-audit-proxy-compare.sh
              python3 scripts/summarize-perf-sockets.py target/perf/proxy-compare-logs target/perf/webdav-socket-summary.json
              ;;
            feature-callgrind)
              python3 scripts/perf-evaluate.py "feature-rich callgrind diagnostics" -- bash scripts/perf-diagnose-proxy-callgrind.sh
              ;;
            cache-miss-callgrind)
              QPX_CALLGRIND_WORKLOAD=cache-miss python3 scripts/perf-evaluate.py "cache miss callgrind diagnostics" -- bash scripts/perf-diagnose-proxy-callgrind.sh
              ;;
            proxy-native)
              python3 scripts/perf-evaluate.py "native CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              ;;
            webdav-native)
              QPX_NATIVE_WORKLOAD=webdav python3 scripts/perf-evaluate.py "native WebDAV CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              ;;
            http2-native)
              QPX_NATIVE_WORKLOAD=http2 python3 scripts/perf-evaluate.py "native HTTP/2 CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              ;;
            streaming-native)
              QPX_NATIVE_WORKLOAD=streaming python3 scripts/perf-evaluate.py "native streaming CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-proxy-native.sh
              ;;
            http2-events)
              python3 scripts/perf-evaluate.py "HTTP/2 kernel wait events" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-events.sh
              ;;
            http2-mtu)
              python3 scripts/perf-evaluate.py "HTTP/2 isolated MTU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh
              ;;
            http2-observer)
              python3 scripts/perf-evaluate.py "HTTP/2 observer effect diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh --observer
              ;;
            http2-quality)
              python3 scripts/perf-evaluate.py "HTTP/2 complete matrix quality diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh --full
              ;;
            http2-affinity)
              python3 scripts/perf-evaluate.py "HTTP/2 CPU partition quality diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh --full-affinity
              ;;
            http2-client)
              python3 scripts/perf-evaluate.py "HTTP/2 load-generator CPU diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-mtu.sh --full-client
              ;;
            http2-io)
              python3 scripts/perf-evaluate.py "HTTP/2 syscall wait diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-io.sh
              ;;
            http2-windows)
              python3 scripts/perf-evaluate.py "HTTP/2 client window diagnostics" -- timeout --signal=TERM --kill-after=40s 20m bash scripts/perf-diagnose-http2-window.sh
              ;;
            http2)
              python3 scripts/perf-evaluate.py "http2 diagnostics" -- bash scripts/perf-audit-http2-compare.sh
              python3 scripts/perf-evaluate.py "http2 diagnostic objectives" -- bash scripts/check-http2-performance.sh target/perf/perf-audit-http2-compare.jsonl
              ;;
            *) echo "unsupported diagnostic category: $CATEGORY" >&2; exit 2 ;;
          esac
      - name: summarize retained load-generator CPU profiles
        if: always() && inputs.category == 'http2-client'
        run: |
          profiles=(target/perf/profiles/http2-mtu.*/client-profiles)
          if [ "${#profiles[@]}" -ne 1 ] || [ ! -d "${profiles[0]}" ]; then
            echo "load-generator CPU profile directory is missing or ambiguous" >&2
            exit 1
          fi
          python3 scripts/summarize-perf-client.py "${profiles[0]}" "$QPX_NATIVE_PERF_BIN"
      - name: upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-diagnostics-${{ inputs.category || 'streaming' }}
          path: target/perf/**
          if-no-files-found: error
