[alias]
xtask = "run -p xtask --"

# Skip registry versions published more recently than this window when
# resolving dependencies (Cargo 1.100+). Complements the CI cargo audit/deny
# gate with a pre-resolution defense; committed Cargo.lock and --locked
# --offline CI builds are unaffected. Older Cargo warns and ignores the key.
# See docs/operations.md for the urgent-patch override.
[registry]
global-min-publish-age = "3 days"
